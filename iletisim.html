<html>
<head>
    <title>İletişim</title>
    <style>
        body {
            background-color: #e0ffff;
            font-family: Arial, sans-serif;
            color: #333;
        }

        a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
            font-size: 18px;
        }

        td {
            padding: 8px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <table style="width: 100%; background-color: #333333; padding: 15px;">
        <tr>
            <td style="text-align: center;">
                <a href="index.html">Ana Sayfa</a> |
                <a href="hakkimda.html">Hakkımda</a> |
                <a href="resimler.html">Resimlerim</a> |
                <a href="ozel_sayfa.html">Özel Sayfa</a> |
                <a href="iletisim.html">İletişim</a>
            </td>
        </tr>
    </table>

    <h2 style="text-align: center; color: #008080;">Benimle İletişime Geçin</h2>
    <p style="text-align: center; font-size: 16px;">Fikir alışverişi veya projeler için aşağıdaki formu doldurabilirsiniz.</p>

    <center>
        <table style="width: 50%; background-color: white; padding: 20px; border: 2px solid #008080;">
            <tr>
                <td>
                    <form action="#" method="post">
                        <table border="0" style="width: 100%;">
                            <tr>
                                <td style="width: 35%; font-weight: bold; color: #008080;">Adınız:</td>
                                <td><input type="text" name="ad" style="width: 100%; padding: 5px;"></td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; color: #008080;">Soyadınız:</td>
                                <td><input type="text" name="soyad" style="width: 100%; padding: 5px;"></td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; color: #008080;">Cinsiyetiniz:</td>
                                <td>
                                    <input type="radio" name="cinsiyet" value="Erkek"> Erkek
                                    <input type="radio" name="cinsiyet" value="Kadin"> Kadın
                                </td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; color: #008080;">Öğrenim Durumu:</td>
                                <td>
                                    <select name="egitim" style="padding: 5px;">
                                        <option value="Lise">Lise</option>
                                        <option value="Onlisans">Önlisans</option>
                                        <option value="Lisans">Lisans</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; color: #008080;">İlgilendiğiniz Konular:</td>
                                <td>
                                    <input type="checkbox" name="konu" value="Yazilim"> Yazılım
                                    <input type="checkbox" name="konu" value="SiberGuvenlik"> Siber Güvenlik
                                </td>
                            </tr>
                            <tr>
                                <td style="font-weight: bold; color: #008080; vertical-align: top;">Mesajınız:</td>
                                <td><textarea name="mesaj" rows="5" style="width: 100%; padding: 5px;"></textarea></td>
                            </tr>
                            <tr>
                                <td></td>
                                <td style="text-align: right; padding-top: 15px;">
                                    <input type="submit" value="Gönder" style="background-color: #28a745; color: white; padding: 8px 15px; border: none; font-weight: bold;">
                                    <input type="reset" value="Temizle" style="background-color: #dc3545; color: white; padding: 8px 15px; border: none; font-weight: bold;">
                                </td>
                            </tr>
                        </table>
                    </form>
                </td>
            </tr>
        </table>
    </center>

</body>
</html>
